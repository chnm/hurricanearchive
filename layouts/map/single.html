{{ define "main" }}
<div id="browse" class="map">
	<div id="heading">
		<div class="heading">  <h1> Map </h1>
		</div>
	</div>
	<p>{{ .Params.items }} geotagged items.</p>
	<div id="map" style="height: 600px;"></div>
</div>
<script>
window.addEventListener('load', function () {
	fetch('{{ "index.geo.json" | relURL }}').then(function (r) { return r.json(); }).then(function (points) {
		var map = L.map('map').setView([30, -90], 6);
		L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
			attribution: '&copy; OpenStreetMap contributors'
		}).addTo(map);
		var group = L.markerClusterGroup();
		// Clusters are role=button; name them by what they hold, not just the count.
		function labelClusters() {
			document.querySelectorAll('#map .marker-cluster').forEach(function (el) {
				el.setAttribute('aria-label', el.textContent.trim() + ' items here; press Enter to zoom in');
			});
		}
		new MutationObserver(labelClusters).observe(map.getPane('markerPane'), { childList: true });
		points.forEach(function (p) {
			var a = document.createElement('a'); a.href = p.url; a.textContent = p.title;
			L.marker([p.lat, p.lng], { title: p.title, alt: p.title }).bindPopup(a).addTo(group);
		});
		group.addTo(map);
		if (points.length) { map.fitBounds(group.getBounds().pad(0.1)); }
		labelClusters();
	});
});
</script>
{{ end }}
