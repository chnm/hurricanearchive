baseURL = ""
title = "Hurricane Digital Memory Bank"
languageCode = "en-us"
disableKinds = ["RSS"]

[params]
  origin = "https://hurricanearchive.org"
  site_name = "hurricanearchive"

[taxonomies]
  collection = "collections"
  tag = "tags"

[pagination]
  pagerSize = 50

[markup.goldmark.renderer]
  unsafe = true

# index.geo.json feeds the map. Built from data/geo.json so popups get the same titles as item pages.
[outputFormats.geo]
  mediaType = "application/json"
  baseName = "index.geo"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "geo"]
